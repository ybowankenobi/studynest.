<body><div id="app" class="wrap"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#6366f1','#ef4444','#f59e0b','#10b981','#06b6d4','#ec4899','#8b5cf6','#64748b'];
let DL=null,IMG={},db=null,sample=null,U=null,D={subjects:[]},cur=null,tab='learn',q='',fi=0,flip=false,busy='',msg='',ans={},done=false,modalColor=COLORS[0];
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const enc=new TextEncoder();
const idOf=async e=>hex(await crypto.subtle.digest('SHA-256',enc.encode(e.trim().toLowerCase())));
async function pbk(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
async function getDoc(p){if(db){const s=await db.doc(p).get();return s.exists?s.data():null}return ls.get('sn:'+p)}
async function setDoc(p,d){if(db)await db.doc(p).set(d);else ls.set('sn:'+p,d)}
const PART=60000;let lastParts=[],st,SQ=Promise.resolve();
function notify(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=m;e.classList.add('on');clearTimeout(notify.t);notify.t=setTimeout(()=>e.classList.remove('on'),7000)}
function cut(j){const a=[];let i=0;while(i<j.length){let e=Math.min(j.length,i+PART);if(e<j.length){const c=j.charCodeAt(e);if(c>=0xDC00&&c<=0xDFFF)e--}a.push(j.slice(i,e));i=e}return a.length?a:['']}
async function flush(){
  if(!U)return;
  const id=U.id,parts=cut(JSON.stringify(D));
  for(let i=1;i<parts.length;i++)if(lastParts[i]!==parts[i])await setDoc('studies/'+id+'_'+i,{p:parts[i]});
  if(lastParts.length!==parts.length||lastParts[0]!==parts[0])await setDoc('studies/'+id,{n:parts.length,p:parts[0]});
  for(let i=parts.length;i<lastParts.length;i++)await delDoc('studies/'+id+'_'+i);
  lastParts=parts;
}
function save(){clearTimeout(st);st=setTimeout(()=>{SQ=SQ.then(flush).catch(e=>notify('⚠️ Could not save your changes: '+((e&&e.message)||'storage error')))},500)}
async function loadAll(id){
  const r=await getDoc('studies/'+id);lastParts=[];
  if(!r)return{subjects:[]};
  if(r.json)return JSON.parse(r.json);
  const parts=[r.p||''];for(let i=1;i<(r.n|0);i++){const x=await getDoc('studies/'+id+'_'+i);parts.push((x&&x.p)||'')}
  lastParts=parts;return JSON.parse(parts.join('')||'{"subjects":[]}');
}
const uid=()=>Math.random().toString(36).slice(2,10);
const sub=()=>D.subjects.find(s=>s.id===cur);

async function boot(){
  app.innerHTML='<p class="mut">Loading…</p>';
  try{db=await claude.use('db')}catch(e){}
  try{sample=await claude.use('sample')}catch(e){}
  try{DL=await claude.use('downloads')}catch(e){}
  const s=ls.get('sn:sess');
  if(s){try{U=s;D=await loadAll(s.id)}catch(e){U=null}}
  render();
}

/* ---------- auth ---------- */
let mode='login';
function authView(){
  const su=mode==='signup';
  app.innerHTML=`<div class="authwrap"><div class="pitch"><div class="logo" style="cursor:default">🦉 Study<span>Nest</span></div><h1>Study smarter, <em>not harder.</em></h1><ul><li>📁 Upload whole course files</li><li>📖 AI turns them into clear topics</li><li>🃏 Flashcards, practice and quizzes</li></ul></div>
  <div class="auth card"><h2 style="margin:0 0 4px;font-weight:900">${su?'Create your account 🎉':'Welcome back 👋'}</h2>
  <p class="mut" style="margin-top:0">${su?'It takes less than a minute.':'Log in to pick up where you left off.'}</p>
  ${su?'<label>Name</label><input id="nm" class="in" autocomplete="name">':''}
  <label>Email</label><input id="em" class="in" type="email" autocomplete="email">
  <label>Password</label><input id="pw" class="in" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'At least 8 characters':''}">
  ${su?'<label>Confirm password</label><input id="pw2" class="in" type="password" autocomplete="new-password">':''}
  <div class="err" id="er"></div>
  <button class="btn" style="width:100%" id="go">${su?'Create account':'Log in'}</button>
  <p class="mut" style="text-align:center;margin-bottom:0">${su?'Already registered?':'New here?'} <a href="#" id="sw" style="color:var(--ac);font-weight:800">${su?'Log in':'Create an account'}</a></p></div></div>`;
  $('#sw').onclick=e=>{e.preventDefault();mode=su?'login':'signup';authView()};
  $('#go').onclick=submitAuth;
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submitAuth()});
}
async function submitAuth(){

  let h=`<div class="bar">${gen('practice',it.length?'✨ New practice quiz':'✨ Generate practice quiz')}${it.length?`<span class="mut" style="font-weight:800">Self-score: ${got} / ${seen} checked</span>`:''}</div>${note()}`;
  if(!it.length)return h+'<div class="empty"><div class="big">✍️</div><p>Generate open-ended questions from your material, answer them yourself, then reveal the model answer.</p></div>';
  return h+it.map((p,i)=>`<div class="card" style="margin-bottom:12px"><b>${i+1}. ${M(p.q)}</b><textarea class="in" style="min-height:70px;margin-top:10px" placeholder="Type your answer…" oninput="pqa[${i}]=this.value">${esc(pqa[i]||'')}</textarea>${pqr[i]?`<div class="ex"><b>Model answer</b><p style="margin:6px 0 0">${M(p.a)}</p></div><div class="rate" style="justify-content:flex-start"><button class="btn ${pqs[i]===false?'':'alt'}" onclick="pqs[${i}]=false;subjectView()">❌ Missed it</button><button class="btn ${pqs[i]===true?'':'alt'}" onclick="pqs[${i}]=true;subjectView()">✅ Got it</button></div>`:`<button class="btn alt" onclick="pqr[${i}]=true;subjectView()">Reveal answer</button>`}</div>`).join('');
}
/* ----- quiz & exam ----- */
function quizTab(s){
  return modeBtns(qmode,'qmode',[['quiz','🎯 Quiz','10 multiple-choice questions · quick check'],['exam','📝 Exam','59 items · multiple choice, true or false, identification']])+(qmode==='exam'?examHTML(s):quizHTML(s));
}
function quizHTML(s){
  let h=`<div class="bar">${gen('quiz',s.quiz.length?'✨ New quiz':'✨ Generate quiz')}</div>${note()}`;
  if(!s.quiz.length)return h+'<div class="empty"><div class="big">🎯</div><p>Generate a 10-question multiple-choice quiz from your material.</p></div>';
  h+=s.quiz.map((x,i)=>`<div class="card" style="margin-bottom:10px"><b>${i+1}. ${M(x.q)}</b>${x.options.map((o,j)=>{const c=done?(j===x.answer?'ok':ans[i]===j?'no':''):'';return `<label class="opt ${c}"><input type="radio" name="q${i}" ${ans[i]===j?'checked':''} ${done?'disabled':''} onchange="ans[${i}]=${j}"> ${M(o)}</label>`}).join('')}${done&&x.explain?`<p class="mut" style="margin-bottom:0">${M(x.explain)}</p>`:''}</div>`).join('');
  if(!done)return h+`<button class="btn" onclick="done=true;subjectView();scrollTo({top:0})">Submit quiz</button>`;
  const sc=s.quiz.filter((x,i)=>ans[i]===x.answer).length,r=sc/s.quiz.length;
  return `<div class="card score" style="margin-bottom:14px"><div class="em">${r>=.8?'🏆':r>=.5?'👏':'💪'}</div><b>${sc} / ${s.quiz.length} (${Math.round(r*100)}%)</b><p class="mut">${r>=.8?'Outstanding!':r>=.5?'Nice work, keep going!':'Good start. Review and try again!'}</p><button class="btn" onclick="ans={};done=false;subjectView()">Retake</button></div>`+h;
}
const normA=x=>String(x==null?'':x).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const exOk=(x,i)=>{if(x.type==='id'){if(eov[i])return true;const u=normA(eans[i]);return !!u&&[x.answer,...(x.accept||[])].some(a=>normA(a)===u)}return eans[i]===x.answer};
function examHTML(s){
  const ex=(s.exam&&s.exam.items)||[];
  let h=`<div class="bar">${gen('exam',ex.length?'✨ New exam':'✨ Generate exam')}</div>${note()}`;
  if(!ex.length)return h+'<div class="empty"><div class="big">📝</div><p>Your exam has 59 items: 30 multiple choice, 14 true or false and 15 identification, built from your material.</p></div>';
  const parts=[['mc','Part I · Multiple choice'],['tf','Part II · True or false'],['id','Part III · Identification']];
  const card=(x,i,n)=>{
    let b='';
    if(x.type==='mc')b=x.options.map((o,j)=>{const c=edone?(j===x.answer?'ok':eans[i]===j?'no':''):'';return `<label class="opt ${c}"><input type="radio" name="e${i}" ${eans[i]===j?'checked':''} ${edone?'disabled':''} onchange="eans[${i}]=${j}"> ${M(o)}</label>`}).join('');
    else if(x.type==='tf')b=[true,false].map(v=>{const c=edone?(v===x.answer?'ok':eans[i]===v?'no':''):'';return `<label class="opt ${c}"><input type="radio" name="e${i}" ${eans[i]===v?'checked':''} ${edone?'disabled':''} onchange="eans[${i}]=${v}"> ${v?'True':'False'}</label>`}).join('');
    else b=`<input class="in" style="margin-top:10px" placeholder="Your answer…" value="${esc(eans[i]||'')}" ${edone?'disabled':''} oninput="eans[${i}]=this.value">`+(edone?`<p class="verdict">${exOk(x,i)?'✅ Correct':'❌ Answer: '+M(x.answer)}</p>${exOk(x,i)?'':`<button class="btn alt" onclick="eov[${i}]=true;subjectView()">Mark as correct</button>`}`:'');
    return `<div class="card" style="margin-bottom:10px"><b>${n}. ${M(x.q)}</b>${b}${edone&&x.explain?`<p class="mut" style="margin:8px 0 0">${M(x.explain)}</p>`:''}</div>`;
  };
  let body='',n=0;
  parts.forEach(([ty,title])=>{const ix=ex.map((x,i)=>i).filter(i=>ex[i].type===ty);if(!ix.length)return;body+=`<h3 class="part">${title} <span class="mut">(${ix.length} items)</span></h3>`+ix.map(i=>card(ex[i],i,++n)).join('')});
  if(!edone)return h+body+`<button class="btn" onclick="edone=true;subjectView();scrollTo({top:0})">Submit exam</button>`;
  const ok=ex.filter((x,i)=>exOk(x,i)).length,r=ok/ex.length,by=t=>{const a=ex.map((x,i)=>i).filter(i=>ex[i].type===t);return a.filter(i=>exOk(ex[i],i)).length+'/'+a.length};
  return h+`<div class="card score" style="margin-bottom:14px"><div class="em">${r>=.8?'🏆':r>=.5?'👏':'💪'}</div><b>${ok} / ${ex.length} (${Math.round(r*100)}%)</b><p class="mut">Multiple choice ${by('mc')} · True/False ${by('tf')} · Identification ${by('id')}</p><button class="btn" onclick="eans={};edone=false;eov={};subjectView()">Retake</button></div>`+body;
}
async function examSources(s){
  const src=[];
  if((s.notes||'').trim())for(let i=0;i<s.notes.length&&src.length<4;i+=9000)src.push(s.notes.slice(i,i+9000));
  const refs=[];(s.files||[]).forEach(f=>{for(let b=0;b<(f.nb|0);b++)refs.push([f,b])});
  refs.sort(()=>Math.random()-.5);
  for(const [f,b] of refs.slice(0,8)){const r=await getDoc(btPath(f.id,b));if(r&&r.t)src.push(r.t.slice(0,9000))}
  if(!src.length&&s.topics.length)src.push(s.topics.map(t=>t.title+': '+(t.definition||t.summary||'')+' '+String(t.idea||t.details||'').slice(0,600)).join('\n').slice(0,12000));
  return src;
}
async function makeExam(){
  const s=sub();
  if(!sample){msg='!AI generation is not available in this view.';return subjectView()}
  busy='exam';msg='Building your exam (part 1 of 4)…';subjectView();
  try{
    const src=await examSources(s);
    if(!src.join('').trim())throw new Error('Add study material first: upload a file, add notes, or create topics.');
    const mat=i=>{let p=src.filter((_,j)=>j%4===i);if(!p.length)p=[src[i%src.length]];return '\n\nSTUDY MATERIAL:\n'+p.join('\n\n').slice(0,16000)};
    const base=J+'Subject: '+s.name+'. Cover different parts of the material and never repeat a question. ',mcP='Write exactly 15 multiple-choice questions, 4 options each, one correct; "answer" is the 0-based index of the correct option. Schema: {"items":[{"q":string,"options":[string,string,string,string],"answer":number,"explain":string}]}.';
    const step=async(i,prompt)=>{msg='Building your exam (part '+(i+1)+' of 4)…';subjectView();return await aiJSON(base+prompt+mat(i))};
    const a=await step(0,mcP),b=await step(1,mcP);
    const c=await step(2,'Write exactly 14 true-or-false statements, about half true and half false. Schema: {"items":[{"q":string (a statement),"answer":boolean,"explain":string}]}.');
    const d=await step(3,'Write exactly 15 identification questions whose answer is a short term, name or phrase (1-4 words). Schema: {"items":[{"q":string,"answer":string,"accept":[string] (acceptable alternative answers),"explain":string}]}.');
    const mc=[...(a.items||[]),...(b.items||[])].filter(x=>x.options&&x.options.length>1&&Number.isInteger(x.answer)).map(x=>({...x,type:'mc'}));
    const tf=(c.items||[]).filter(x=>typeof x.answer==='boolean').map(x=>({...x,type:'tf'}));
    const idn=(d.items||[]).filter(x=>x.answer).map(x=>({...x,type:'id',accept:x.accept||[]}));
    s.exam={items:[...mc,...tf,...idn],at:Date.now()};eans={};edone=false;eov={};save();
    msg='Exam ready: '+s.exam.items.length+' items.';
  }catch(e){msg='!Could not build the exam: '+((e&&e.message)||'please try again.')}
  busy='';subjectView();
}
/* ---------- AI ---------- */
const MATHNOTE=String.raw`Write ALL mathematics in LaTeX, in every text field: inline math as \\( ... \\) and display equations as \\[ ... \\]. Because your reply is JSON, every backslash must be doubled exactly as shown here (for example \\frac, \\sqrt, \\alpha, \\sum).`;
const J='Respond with ONLY valid JSON, no markdown fences or commentary. '+MATHNOTE+' ';
const fixCtl=v=>typeof v==='string'?v.replace(/\f/g,'\\f').replace(/\x08/g,'\\b').replace(/\v/g,'\\v').replace(/\t/g,'\\t').replace(/\r/g,'\\r'):Array.isArray(v)?v.map(fixCtl):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fixCtl(x)])):v;
async function aiJSON(prompt,opts){
  const r=await sample(prompt,opts);let t=(r.text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i)t=t.slice(i,j+1);
  try{return fixCtl(JSON.parse(t))}catch(e){}
  try{return fixCtl(JSON.parse(t.replace(/\\(?!["\\\/]|u[0-9a-fA-F]{4})/g,'\\\\')))}catch(e){throw new Error('The AI reply could not be read'+(r.truncated?' (it was cut off)':'')+'. Please try again.')}
}

async function run(k){
  if(k==='learn')return makeTopics();
  if(k==='exam')return makeExam();
  const s=sub(),src=(await material(s)).trim(),imgs=(s.images||[]).filter(i=>src.includes(i.id));
  if(src.length<30&&!imgs.some(i=>i.caption)){msg='!Upload a file in the Files tab (or add notes in the Learn tab) first.';return subjectView()}
  if(!sample){msg='!AI generation is not available in this view.';return subjectView()}
  busy=k;msg='';subjectView();
  const text='\n\nSTUDY MATERIAL:\n'+src.slice(0,14000)+(imgs.length?'\n\nIMAGES (each appears in the material as [[IMG:id]]):\n'+imgs.map(i=>i.id+': '+(i.caption||'(no description)')).join('\n'):'');
  try{
    if(k==='learn'){
      const r=await aiJSON(J+'Subject: '+s.name+'. Extract from the material 4-10 key topics and 8-20 flashcards. Schema: {"topics":[{"title":string,"summary":string (2-3 sentences),"points":[string,...3-5],"images":[string]}],"cards":[{"q":string,"a":string,"img":string|null}]}. Use only facts from the material. Add "images":[image ids] to each topic whose text discusses an image (use the [[IMG:id]] markers and captions; only ids from the IMAGES list), and set a flashcard "img" when the question depends on that image.'+text);
      const ok=new Set(imgs.map(i=>i.id));s.topics=(r.topics||[]).map(t=>({...t,images:(t.images||[]).filter(x=>ok.has(x))}));(r.cards||[]).forEach(c=>{if(!ok.has(c.img))c.img=null});s.cards=(s.cards||[]).concat(r.cards||[]);msg='Created '+s.topics.length+' topics and '+(r.cards||[]).length+' flashcards.';
    }else if(k==='cards'){
      const have=s.cards.map(c=>c.q).slice(-40).join(' | ');
      const r=await aiJSON(J+'Write 10 NEW flashcards from the material that do not repeat these questions: '+have+'. Schema: {"cards":[{"q":string,"a":string}]}.'+text);
      s.cards=s.cards.concat(r.cards||[]);
    }else if(k==='practice'){
      const r=await aiJSON(J+'Write 8 open-ended practice questions (mix of recall, explain and apply) with model answers. Schema: {"items":[{"q":string,"a":string}]}.'+text);
      s.practice=r.items||[];pqa={};pqr={};pqs={};
    }else if(k==='quiz'){
      const r=await aiJSON(J+'Write 10 multiple-choice questions, 4 options each, one correct. "answer" is the 0-based index of the correct option. Schema: {"items":[{"q":string,"options":[string,string,string,string],"answer":number,"explain":string}]}.'+text);
      s.quiz=(r.items||[]).filter(x=>x.options&&x.options.length>1);ans={};done=false;
    }
    save();
  }catch(e){msg='!Generation failed: '+((e&&e.message)||'please try again.')}
  busy='';subjectView();
}

function render(){if(U)fixJobs();U?(cur&&sub()?subjectView():(cur=null,home())):authView()}
boot();
